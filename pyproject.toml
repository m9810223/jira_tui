[project]
name = "jira_tui"
version = "0.1.0"
description = "Jira Dashboard TUI"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic",
    "pydantic-settings",
    "textual",
]

[project.scripts]
jira_tui = "jira_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_tui"]

[tool.ruff]
format.quote-style = "single"
